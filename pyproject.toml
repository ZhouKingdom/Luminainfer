[project]
name = "zjh-vllm"
version = "0.2.0"
authors = [{ name = "zjh" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage = "https://github.com/zjh/zjh-vllm"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zjhvllm"
module-root = ""

[tool.uv]
package = true
python-preference = "system"
index-url = "https://pypi.mirrors.ustc.edu.cn/simple/"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]

[tool.uv.sources]
# flash-attn 官方只发布了 cu12+torch2.8 的 cp312 wheel，USTC 镜像没有 wheel 只有源码（源码在 cu12.8 下编译会卡死），
# 因此直接引用官方预编译 wheel，避免 uv sync 时现场编译。
# 若 ghfast.top 不可用，可把下面 URL 换成不带 https://ghfast.top/ 前缀的 GitHub 直链。
flash-attn = { url = "https://ghfast.top/https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1%2Bcu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

